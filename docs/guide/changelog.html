<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Changelog</title>
<!--
  What changed on the guide page (how-dev-loop-works.html), one entry per
  guide version. The entries live in guide-changes.js; this page only draws
  them. Each version has an anchor (#v1-1-0) so a link can point at it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #f6f7f4; --ink: #1d2420; --muted: #5d6862; --line: #c9d0cb; --card: #ffffff; --key: #c98a1c;
  --display: "Fraunces", Georgia, serif;
  --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a17; --ink: #e6ebe7; --muted: #9aa69f; --line: #34403a; --card: #1b221e; --key: #e3a83c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a17; --ink: #e6ebe7; --muted: #9aa69f; --line: #34403a; --card: #1b221e; --key: #e3a83c; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
.col {
  max-width: 820px; margin: 0 auto; padding-block: 36px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px;
}
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.15; }
h2 { font-size: 1.3rem; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
h2 a.self { color: inherit; text-decoration: none; }
h2 a.self:hover { text-decoration: underline; }
.date { font: .9rem var(--body); color: var(--muted); }
.sub { color: var(--muted); margin: 0; }
a { color: var(--ink); }
a:focus-visible { outline: 3px solid var(--key); outline-offset: 2px; }
.back { font-size: .92rem; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 10px; scroll-margin-top: 16px; }
article:target { border-color: var(--key); box-shadow: 0 0 0 2px var(--key); }
article .title { margin: 0; font-weight: 700; }
ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
li .when { color: var(--muted); font-size: .85rem; white-space: nowrap; }
li .links { font-size: .9rem; }
li .links a + a::before { content: "·"; display: inline-block; margin: 0 6px; color: var(--muted); }
@media (max-width: 480px) { article { padding: 14px 14px; } h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
<div class="col">
  <header style="display:grid;gap:10px">
    <a class="back" href="how-dev-loop-works.html">← How dev-loop works</a>
    <h1>What changed on the guide</h1>
    <p class="sub">The guide has its own version, separate from dev-loop's. Each entry says what changed on the page and links the matching section of dev-loop's CHANGELOG or its design spec.</p>
  </header>
  <main id="entries" style="display:grid;gap:16px"></main>
</div>
<script src="guide-changes.js"></script>
<script>
(function () {
  const root = document.getElementById("entries");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  for (const c of window.GUIDE_CHANGES || []) {
    const id = "v" + c.version.replace(/\./g, "-");
    const art = el("article"); art.id = id;
    const h = el("h2"); const self = el("a", "self", "v" + c.version); self.href = "#" + id;
    h.append(self, el("span", "date", c.date)); art.append(h, el("p", "title", c.title));
    const ul = el("ul");
    for (const it of c.items) {
      const li = el("li"); li.append(it.text + " ");
      if (it.date && it.date !== c.date) li.append(el("span", "when", "(" + it.date + ")"));
      if (it.links && it.links.length) {
        const ls = el("span", "links"); ls.append(" ");
        for (const l of it.links) { const a = el("a", null, l.label); a.href = l.href; a.target = "_blank"; a.rel = "noopener noreferrer"; ls.append(a); }
        li.append(ls);
      }
      ul.append(li);
    }
    art.append(ul); root.append(art);
  }
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
</body>
</html>
